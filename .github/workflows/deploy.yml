name: Deploy to EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: 3.140.24.199
          username: ec2-user
          key: ${{ secrets.PARALLAX_EC2_SSH_KEY }}
          script: |
            cd ~/parallax
            git fetch origin
            git reset --hard origin/main
            npm install --prefer-offline
            npm run build
            pm2 restart parallax --update-env
            pm2 restart cloudflared 2>/dev/null || true
